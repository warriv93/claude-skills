/* ---------- timeline ---------- */
/* time spent in each phase of milestone m, from its phase events (a phase entered twice adds up) */
function phaseTimes(m) {
  const evs = S.events.filter((e) => e.milestone === m.id && ["planned", "phase", "landed"].includes(e.type))
    .map((e) => ({ ...e, t: Date.parse(e.at) })).filter((e) => !isNaN(e.t)).sort((a, b) => a.t - b.t);
  const out = {};
  evs.forEach((e, i) => {
    const p = e.type === "phase" ? e.phase : e.type === "planned" && !evs.some((x) => x.phase === "recon") ? "recon" : null;
    if (!p) return;
    const next = evs[i + 1];
    const end = next ? next.t : m.status === "done" ? null : Date.now();
    if (end == null) return;
    const o = (out[p] ||= { ms: 0, start: e.t, open: false });
    o.ms += end - e.t;
    o.open = !next;
  });
  return out;
}
/* each build wave's span, from its stories' start and finish */
function waveTimes(m) {
  const st = m.stories || [], by = Object.fromEntries(st.map((s) => [s.id, s])), depth = {};
  const d = (s) => (depth[s.id] ??= 1 + Math.max(0, ...[...(s.deps || []), ...(s.overlapAfter || [])].filter((x) => by[x]).map((x) => d(by[x]))));
  const waves = [];
  st.forEach((s) => {
    if (!s.startedAt) return;
    const a = Date.parse(s.startedAt), b = s.finishedAt ? Date.parse(s.finishedAt) : Date.now(), w = d(s) - 1;
    const o = (waves[w] ||= { start: a, end: b, n: 0, open: false });
    o.start = Math.min(o.start, a); o.end = Math.max(o.end, b); o.n++; o.open ||= !s.finishedAt;
  });
  return waves;
}
const shortDur = (ms) => { const m = Math.round(ms / 60000); return m < 1 ? "<1m" : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ""}`; };
function timelineSec(m) {
  const pt = phaseTimes(m), wv = waveTimes(m);
  const rows = PHASES.filter(([k]) => pt[k]).map(([k, label]) => ({ k, label, ...pt[k] }));
  if (!rows.length) return "";
  // scaled to the finished phases, so a phase still waiting (on the user, say) doesn't flatten the rest; it fills the bar
  const done = [...rows.filter((r) => !r.open).map((r) => r.ms), ...wv.filter((w) => w && !w.open).map((w) => w.end - w.start)];
  const max = Math.max(1, ...(done.length ? done : rows.map((r) => r.ms)));
  const row = (label, ms, open, cls = "") => `<div class="trow ${cls} ${open ? "open" : ""}"><span class="tk">${label}</span><span class="tbar"><i style="width:${Math.min(100, Math.max(1.5, (ms / max) * 100))}%"></i></span><span class="tv">${dur(ms)}${open ? " so far" : ""}</span></div>`;
  const total = rows.reduce((n, r) => n + r.ms, 0);
  return `<div class="sec"><h3>Timeline<span class="muted tsum">${dur(total)} in all</span></h3><div class="tl">${rows.map((r) =>
    row(esc(r.label), r.ms, r.open) + (r.k === "build" ? wv.map((w, i) => (w ? row(`Wave ${i + 1} <span class="muted">· ${w.n}</span>`, w.end - w.start, w.open, "wave") : "")).join("") : "")).join("")}</div></div>`;
}

    ${(s.files || []).length ? `<div class="sec"><h3>Files in scope</h3>${s.files.map((f) => fileLink(f, "repoDir")).join("")}</div>` : ""}
    ${(s.tasks || []).length ? `<div class="sec"><h3>Tasks</h3><div class="links">${s.tasks.map((t) => `<span class="link-chip mono">${esc(t)}</span>`).join("")}</div></div>` : ""}
    ${live || s.agent ? `<div class="sec"><h3>Run</h3><dl class="kv"><dt>Status</dt><dd>${label}</dd><dt>Attempts</dt><dd>${s.attempts || 0} of 2</dd><dt>Model</dt><dd>${esc(s.model || "—")}</dd><dt>Agent</dt><dd class="mono">${s.agent ? `${esc(s.agent.backend)} · ${esc(s.agent.id)}${agentHref(s) ? ` · <a class="prlink" href="${esc(agentHref(s))}">open in Paseo ↗</a>` : ""}` : "—"}</dd><dt>Branch</dt><dd class="mono">${esc(s.branch || "—")}</dd><dt>Elapsed</dt><dd>${elapsed}</dd></dl></div>` : ""}
    ${live ? `<div class="sec"><h3>Progress</h3>${log.length ? `<ul class="log">${log.map((l) => `<li><span class="t">${esc(clock(l.at))}</span><span><span class="stage ${esc(l.stage)}">${esc(l.stage)}</span></span><span>${esc(l.note)}</span></li>`).join("")}</ul>` : `<div class="muted">No progress yet</div>`}</div>` : ""}
    <div class="sec"><h3>Commits</h3>${(s.commits || []).map((c) => `<div class="commit">${shaLink(c.sha)}<span>${esc(c.subject)}</span><span class="mono">${c.plus != null ? `<span class="plus">+${c.plus}</span> <span class="minus">−${c.minus || 0}</span>` : ""}</span></div>`).join("") || `<div class="muted">None yet</div>`}</div>`;
}

function milestoneSheet(m) {
  const map = msById(), st = viewStatus(m, map);
  const stories = m.stories || [];
  const wt = st === "working" && msWaits(m), bst = wt ? "needs" : st;
  const label = wt ? "Waiting on you" : { done: "Completed", working: "Working on", ready: "Ready", waiting: "Waiting on dependencies", draft: "Draft", parked: "Parked", later: "Later", dropped: "Dropped" }[st] || st;
  const blocks = S.epic.milestones.filter((x) => (x.deps || []).includes(m.id));
  const actions = [
    stories.length && S.view !== m.id && !S.epic.single ? `<button class="btn big" data-drill="${esc(m.id)}">Open story map ›</button>` : "",
    [...UNSTARTED, "ready"].includes(st) ? `<button class="btn big ${stories.length ? "ghost" : ""}" data-act="plan" data-id="${esc(m.id)}">Plan milestone</button>${copyBtn("plan", m.id)}` : "",
  ].join(" ");
  const q = m.quality?.gate;
  $("sheet-head").innerHTML = `<div class="top" style="display:flex;gap:8px;align-items:center"><span class="sid">${esc(m.id)}</span>${st === "working" ? `<span class="pulse${wt ? " amber" : ""}"></span>` : ""}<span class="badge ${bst}">${label}</span></div><h2>${esc(m.title)}</h2><div class="muted">${esc(m.summary || "")}</div>${actions.trim() ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${actions}</div>` : ""}`;
  $("sheet-body").innerHTML = `
    ${m.note ? `<div class="sec"><div class="muted">${esc(m.note)}</div></div>` : ""}
    <div class="sec"><h3>Run</h3><dl class="kv">
      <dt>Status</dt><dd>${label}${m.status === "working" ? ` · ${msDoing(m)}` : ""}</dd>
      ${((k) => (k ? `<dt>Mock</dt><dd><a class="prlink" href="${esc(k.href)}" target="_blank" rel="noopener">Open mock ↗</a>${k.url ? ` · <a class="prlink" href="${esc(k.url)}" target="_blank" rel="noopener">published ↗</a>` : ""}</dd>` : ""))(mockOf(m))}
      ${m.shippedAt ? `<dt>Landed</dt><dd>${esc(m.shippedAt)} · ${shaLink(m.landedSha)}</dd>` : ""}
      ${m.branch ? `<dt>Branch</dt><dd class="mono">${esc(m.branch)}</dd>` : ""}
      ${m.spec ? `<dt>Spec</dt><dd>${fileLink(m.spec, "repoDir")}</dd>` : ""}
      ${m.archive ? `<dt>Ledger</dt><dd>${fileLink(m.archive)}</dd>` : ""}
      ${stories.length ? `<dt>Stories</dt><dd>${stories.filter((s) => s.status === "done").length} of ${stories.length} ${m.status === "done" ? "done" : "merged to branch"}</dd>` : ""}
      ${q ? `<dt>Quality gate</dt><dd>${q.findings} findings · ${q.fixed} fixed · ${q.skipped} skipped${q.note ? `<div class="muted">${esc(q.note)}</div>` : ""}</dd>` : ""}
    </dl></div>
    ${timelineSec(m)}
    ${(m.covers || []).length ? `<div class="sec"><h3>Covers brief items</h3><div class="links">${m.covers.map((c) => `<span class="link-chip">${esc(c)}</span>`).join("")}</div></div>` : ""}
    <div class="sec"><h3>Dependencies</h3><dl class="kv"><dt>Depends on</dt><dd><div class="links">${(m.deps || []).map((x) => chip(x, map)).join("") || `<span class="muted">Nothing</span>`}</div></dd><dt>Unblocks</dt><dd><div class="links">${blocks.map((x) => chip(x.id, map)).join("") || `<span class="muted">Nothing</span>`}</div></dd></dl></div>
    ${(m.open || []).length ? `<div class="sec"><h3>Open questions</h3><ul class="md">${m.open.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${briefSec(m.brief)}`;
}

function epicSheet() {
  const e = S.epic, map = msById();
  $("sheet-head").innerHTML = `<span class="sid">Epic</span><h2>${esc(e.epic.title)}</h2><div class="muted">${esc(e.epic.summary || "")}</div>`;
  $("sheet-body").innerHTML = `
    <div class="sec"><h3>Milestones</h3>${e.milestones.map((m) => `<div class="commit"><span class="sid">${esc(m.id)}</span><span>${m.stories?.length ? `<a data-drill="${esc(m.id)}">${esc(m.title)}</a>` : `<a data-open="${esc(m.id)}">${esc(m.title)}</a>`}</span><span class="badge ${viewStatus(m, map)}">${esc(m.status)}</span></div>`).join("")}</div>
    ${(e.uncovered || []).length ? `<div class="sec"><h3>Brief items no milestone covers yet</h3><div class="links">${e.uncovered.map((c) => `<span class="link-chip">${esc(c)}</span>`).join("")}</div></div>` : ""}
    <div class="sec"><h3>Run</h3><dl class="kv"><dt>Active</dt><dd>${esc(e.active || "none")}</dd><dt>Dispatcher</dt><dd>${esc(e.dispatcher || "")}</dd><dt>Podium</dt><dd class="mono">${esc(location.href)}</dd></dl></div>
    ${briefSec(e.epic.spec, "Brief")}`;
}

/* ---------- tiny markdown ---------- */
/* a section heading's icon, by what the section is about (brief, spec and sheet headings) */
const HEAD_ICONS = [["goal", "🎯"], ["objective", "🎯"], ["acceptance", "✅"], ["success criteria", "🏆"], ["files in scope", "📁"], ["files", "📁"],
  ["context", "🧭"], ["depends on", "🔗"], ["dependencies", "🔗"], ["contract", "📜"], ["done when", "🏁"], ["brief items", "📌"], ["covers", "📌"],
  ["brief", "📝"], ["document", "📄"], ["run", "⚙️"], ["progress", "⏱️"], ["timeline", "🗓️"], ["commits", "🔀"], ["tasks", "🗂️"], ["open questions", "❓"],
  ["unknowns", "❓"], ["milestones", "🗺️"], ["decisions", "⚖️"], ["constraints", "🚧"], ["non-goals", "🚫"], ["risks", "⚠️"],
  ["danger", "⚠️"], ["requirements", "📋"], ["edge cases", "🧩"], ["user scenarios", "👤"], ["user story", "👤"], ["reuse", "♻️"],
  ["budget", "💰"], ["data sources", "🛰️"], ["module", "🧱"], ["shape", "🧱"], ["seams", "🧵"], ["story graph", "🕸️"], ["quality gate", "🛡️"]];
const headIcon = (text) => HEAD_ICONS.find(([k]) => text.trim().toLowerCase().startsWith(k))?.[1];
const withIcon = (text, html) => ((i) => (i ? `<span class="hicon">${i}</span>` : "") + html)(headIcon(text));
/* the sheet's own section headings (Brief, Run, Commits…) get theirs once rendered */
function iconSheetHeads() {
  for (const h of $("sheet-body").querySelectorAll(".sec > h3")) {
    const t = h.firstChild;
    if (t?.nodeType === Node.TEXT_NODE && !h.querySelector(".hicon") && headIcon(t.textContent)) t.before(Object.assign(document.createElement("span"), { className: "hicon", textContent: headIcon(t.textContent) }));
  }
}

function md(src) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)_([^_]+)_(?=\W|$)/g, "$1<i>$2</i>");
  const out = [];
  let list = null, code = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of src.split("\n")) {
    if (code !== null) { if (/^```/.test(line)) { out.push(`<pre><code>${esc(code)}</code></pre>`); code = null; } else code += (code ? "\n" : "") + line; continue; }
    if (/^```/.test(line)) { closeList(); code = ""; continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { closeList(); out.push(`<h${m[1].length}>${withIcon(m[2], inline(m[2]))}</h${m[1].length}>`); }
    else if ((m = line.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)/i))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li class="task">${m[1].trim() ? "☑" : "☐"} <span>${inline(m[2])}</span></li>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (!line.trim()) closeList();
    else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList();
  if (code !== null) out.push(`<pre><code>${esc(code)}</code></pre>`);
  return out.join("");
}

/* ---------- time ---------- */
function clock(iso) { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function when(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso || "";
  const ms = Date.now() - d; const m = Math.round(ms / 60000);
  if (m < 1440) return `${clock(iso)} · ${m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`}`;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ` · ${clock(iso)}`;
}
function dur(ms) { const m = Math.max(0, Math.round(ms / 60000)); return m < 1 ? "<1 min" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; }

/* ---------- actions ---------- */
const NO_ORCHESTRATOR = () => `No orchestrator is watching — run /${S.info?.skill || "orchestrate-plan"} in an agent chat, then click again`;
/* the prompt behind a button, for a session of the user's own; the server builds it from the skill's text */
const COPY_ICON = `<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
const releaseBtn = (id) => `<button class="release" data-release="${esc(id)}" title="Take it back: the orchestrator may dispatch it again" aria-label="Take it back">✕</button>`;
async function release(id) {
  try {
    const r = await fetch(`/handoff/${encodeURIComponent(id)}`, { method: "DELETE" });
    if (!r.ok) throw new Error(r.status);
    toast(`${id} is back with the orchestrator`);
    poll();
  } catch {
    toast("Couldn't take it back — is server.py running?");
  }
}
const copyBtn = (action, id) => `<button class="copy" data-copy="${action}" data-id="${esc(id)}" title="Copy the prompt to run it in another session" aria-label="Copy prompt">${COPY_ICON}</button>`;
async function copyPrompt(action, id) {
  try {
    let r = action === "assign"
      ? await fetch(`/handoff/${encodeURIComponent(id)}`, { method: "POST" })
      : await fetch(`/prompt/${action}/${encodeURIComponent(id)}`, { cache: "no-store" });
    const unmarked = r.status === 409;  // no orchestrator to keep it from: copy it without the hand-off
    if (unmarked) r = await fetch(`/prompt/${action}/${encodeURIComponent(id)}`, { cache: "no-store" });
    if (r.status === 404 && !r.headers.get("Content-Type")?.includes("json")) return toast("This server.py predates the copy button — restart it");
    if (!r.ok) throw new Error(r.status);
    await navigator.clipboard.writeText(await r.text());
    if (unmarked) return toast(`Prompt for ${id} copied — no orchestrator is running, so nothing else will build it`);
    toast(action === "assign" ? `${id} is yours — prompt copied; the orchestrator leaves it alone until you take it back` : `Prompt for ${id} copied — paste it in another session`);
    if (action === "assign") poll();
  } catch {
    toast("Couldn't copy the prompt — is server.py running?");
  }
}
async function act(action, id) {
  const path = ["assign", "plan", "human"].includes(action) ? `/${action}/${encodeURIComponent(id)}` : `/${action}`;
  try {
    const r = await fetch(path, { method: "POST" });
    if (r.status === 409) return toast(NO_ORCHESTRATOR());
    if (!r.ok) throw new Error(r.status);
    if (action === "human") { S.human = await r.json(); renderHuman(); return toast({ available: "You're available — the orchestrator brings its questions to you", unavailable: "You're away — the orchestrator keeps going and records its decisions", auto: "Back on your hours" }[id]); }
    toast({ assign: `Queued ${id} — the orchestrator picks it up next`, plan: `Planning ${id} — answer its questions in the orchestrator's chat`, "build-all": "Build all queued — wave by wave", stop: "Stopping after this wave" }[action]);
  } catch {
    toast("The Podium server didn't accept the request — is server.py running?");
  }
}
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }

document.addEventListener("click", (ev) => {
  if (ev.target.closest("a[href]")) return; // a PR link inside a card opens itself, not the card
  const th = ev.target.closest("[data-theme-set]");
  if (th) { setTheme(th.dataset.themeSet); return; }
  const rl = ev.target.closest("[data-release]");
  if (rl) { ev.stopPropagation(); release(rl.dataset.release); return; }
  const cp = ev.target.closest("[data-copy]");
  if (cp) { ev.stopPropagation(); copyPrompt(cp.dataset.copy, cp.dataset.id); return; }
  const ex = !ev.target.closest("[data-settle]") && ev.target.closest("[data-expand]"); // the whole line toggles, not its buttons
  if (ex) { ev.stopPropagation(); const i = Number(ex.dataset.expand); S.expanded ||= new Set(); S.expanded.has(i) ? S.expanded.delete(i) : S.expanded.add(i); render(); return; }
  const st = ev.target.closest("[data-settle]");
  if (st) { ev.stopPropagation(); settle(st.dataset.settle, st.dataset.id); return; }
  const a = ev.target.closest("[data-act]");
  if (a) { ev.stopPropagation(); if (!a.disabled) act(a.dataset.act, a.dataset.id); return; }
  const f = ev.target.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; renderFilters(); applyFilter(); return; }
  if (ev.target.closest("[data-digest-done]")) { S.digestSince = null; render(); return; }
  if (ev.target.closest("[data-epics]")) { setEpic(null); return; }
  const ec = ev.target.closest("[data-epic]");
  if (ec) { setEpic(ec.dataset.epic); return; }
  if (ev.target.closest("[data-up]")) { setView(null); return; }
  const narrow = window.matchMedia("(max-width: 1100px)").matches;
  const d = ev.target.closest("[data-drill]");
  if (d) { if (narrow) $("feed").classList.remove("on"); enterEpicOf(d.dataset.drill); if (S.epic.single) render(); else setView(d.dataset.drill); return; }
  const o = ev.target.closest("[data-open]");
  if (o) {
    if (narrow) $("feed").classList.remove("on");
    if (o.dataset.ms !== undefined) {
      enterEpicOf(o.dataset.ms || o.dataset.open);
      if (S.epic && !S.epic.single && (o.dataset.ms || null) !== S.view) { S.view = o.dataset.ms || null; S.filter = "all"; }
    }
    if (S.epic) openSheet(o.dataset.open);
  }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); $("q").focus(); $("q").select(); }
  else if (ev.key === "Escape") {
    if (S.selected) closeSheet();
    else if (document.activeElement === $("q")) { $("q").value = ""; S.query = ""; applyFilter(); $("q").blur(); }
    else if (S.epic && S.view && !S.epic.single) setView(null);
    else if (S.epic && S.project.epics.length > 1) setEpic(null);
  }
  else if (ev.key === "Enter" && ev.target.matches(".node, .ecard")) ev.target.click();
});
$("q").addEventListener("input", (ev) => { S.query = ev.target.value; applyFilter(); });
new MutationObserver(iconSheetHeads).observe($("sheet-body"), { childList: true });
$("scrim").addEventListener("click", closeSheet);
$("sheet-close").addEventListener("click", closeSheet);
$("feed-toggle").addEventListener("click", () => $("feed").classList.toggle("on"));
$("feed-close").addEventListener("click", () => $("feed").classList.remove("on"));
$("bell").addEventListener("click", async () => {
  if (localStorage.getItem(NOTIFY_KEY) === "1") { localStorage.removeItem(NOTIFY_KEY); toast("Notifications off"); }
  else if (!("Notification" in window)) toast("This browser can't show notifications");
  else if ((await Notification.requestPermission()) === "granted") { localStorage.setItem(NOTIFY_KEY, "1"); toast("You'll get a notification when something new needs you and this tab is in the background"); }
  else toast("Notifications are blocked for this page in the browser's settings");
  if (S.project) renderAttention();
});
document.addEventListener("visibilitychange", () => { if (markSeen()) render(); });
$("feed-filter").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-feed]");
  if (b) { S.feedFilter = b.dataset.feed; renderEvents(); $("events").scrollTop = 0; }
});
window.addEventListener("resize", () => { if (S.epic) renderMap(); });
$("quality").addEventListener("toggle", () => (S.qualityTouched = true), { once: true });

setFavicon("");
poll();
setInterval(poll, POLL_MS);
setInterval(() => { if (S.events.length) renderEvents(); }, 60000);
setInterval(() => document.querySelectorAll("[data-since]").forEach((el) => (el.textContent = dur(Date.now() - Date.parse(el.dataset.since)))), 30000);
</script>
</body>
